name: Task Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  helm:
    name: Helm validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/task-platform

      - name: Render Helm templates
        run: helm template task-platform helm/task-platform

      docker:
        name: Build and publish images
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set lowercase repository owner
            run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Extract backend image metadata
            id: backend-meta
            uses: docker/metadata-action@v5
            with:
              images: ghcr.io/${{ env.OWNER }}/task-platform-backend
              tags: |
                type=sha,prefix=sha-
                type=raw,value=latest,enable={{is_default_branch}}

          - name: Build and push backend image
            uses: docker/build-push-action@v6
            with:
              context: ./backend
              push: ${{ github.event_name == 'push' }}
              tags: ${{ steps.backend-meta.outputs.tags }}
              labels: ${{ steps.backend-meta.outputs.labels }}
              cache-from: type=gha,scope=backend
              cache-to: type=gha,mode=max,scope=backend

          - name: Extract frontend image metadata
            id: frontend-meta
            uses: docker/metadata-action@v5
            with:
              images: ghcr.io/${{ env.OWNER }}/task-platform-frontend
              tags: |
                type=sha,prefix=sha-
                type=raw,value=latest,enable={{is_default_branch}}

          - name: Build and push frontend image
            uses: docker/build-push-action@v6
            with:
              context: ./frontend
              push: ${{ github.event_name == 'push' }}
              tags: ${{ steps.frontend-meta.outputs.tags }}
              labels: ${{ steps.frontend-meta.outputs.labels }}
              cache-from: type=gha,scope=frontend
              cache-to: type=gha,mode=max,scope=frontend