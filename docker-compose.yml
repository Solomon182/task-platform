services:
  postgres:
    image: postgres:16-alpine
    container_name: task-platform-postgres
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: task-platform-backend
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/tasks
    container_name: task-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - task-network

volumes:
  postgres_data:

networks:
  task-network:
    driver: bridge